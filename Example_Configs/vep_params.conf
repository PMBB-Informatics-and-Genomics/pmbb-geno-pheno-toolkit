params {
    input_directory = "${launchDir}/Input" // this needs to be bound if using singularity
    input_prefix = 'chromosome_'
    input_suffix = '.info.vcf.gz'
    chunks_file = "${launchDir}/Input/chromosome_list.txt"
    batches_file = "${launchDir}/Input/batches.tsv"
    output_directory = "${launchDir}/plugin_chunk_results"
    cpu = 1
    // vep_sif = "/path/to/data/vep.sif"
    // vep_sif = "${launchDir}/vep.sif"
    vep_data_directory = "${launchDir}/vep_data" // symlinked to the real cache dir; resolved here since .conf files ARE Groovy-interpolated (unlike vep_plugins.yaml)
    plugins_config_file = "${launchDir}/vep_plugins.yaml"
    download_vep_cache = false
}

process {
    withLabel: 'highmem' { memory = 64.GB } // explicitly set a higher memory for these processes, comment out to let Nextflow decide based on the file sizes
    withName: 'run_vep_plugin' { memory = 32.GB } // explicitly set a higher memory for these processes, comment out to let Nextflow decide based on the file sizes
}
